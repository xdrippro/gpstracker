name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Zip'ni ochish
        run: |
          mkdir proj
          for f in *.zip; do unzip -q -o "$f" -d proj; done
      - name: compileSdk ni 34 qilish
        working-directory: proj
        run: |
          sed -i 's/compileSdk = 33/compileSdk = 34/' app/build.gradle.kts
          printf '\nandroid.suppressUnsupportedCompileSdk=34\n' >> gradle.properties
      - name: Build
        id: build
        continue-on-error: true
        working-directory: proj
        run: gradle assembleDebug --console=plain > build.log 2>&1
      - name: Xato xulosasi
        if: steps.build.outcome == 'failure'
        working-directory: proj
        run: |
          {
            echo '## Build xatosi'
            echo '```'
            sed -n '/What went wrong/,/\* Try:/p' build.log | head -60
            grep -E '^e: ' build.log | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: GpsTracker-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
