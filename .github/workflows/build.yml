name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q gpstracker.zip -d project
          ROOT=$(dirname "$(find project -name settings.gradle.kts | head -n1)")
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build release APK (unsigned)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --console=plain --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GpsTracker-release-unsigned-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
